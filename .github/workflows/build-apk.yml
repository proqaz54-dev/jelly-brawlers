name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android build-tools & platform-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platform-tools" "build-tools;34.0.0" > /dev/null

      - name: Download Godot headless
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p /tmp/tps && cd /tmp/tps && unzip -q /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/tps/templates "$HOME/.local/share/godot/export_templates/4.2.2.stable"

      - name: Configure editor settings (no gradle, SDK paths)
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/gradle_build/use_gradle_build = false\n' \
            "$JAVA_HOME" "$ANDROID_HOME" >> "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project (validate scripts)
        run: godot --headless --path . --import

      - name: Smoke run gameplay
        run: |
          JB_AUTOSTART=1 godot --headless --path . --quit-after 600

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/jelly-brawlers.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jelly-brawlers-debug-apk
          path: build/jelly-brawlers.apk